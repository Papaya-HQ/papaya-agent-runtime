# Builds and smoke-tests the cloud runner image (docker/cloud-runner/Dockerfile)
# on a pull request that could change it. Publishing is the release workflow's
# job, from the tag. Not part of `ci-ok`: an image build is minutes, and most
# pull requests do not touch it.
name: Cloud runner image

on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "bin/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/papaya_agent_runtime/cloud.py"
      - "src/papaya_agent_runtime/serve.py"
      - ".github/workflows/cloud-runner-image.yml"

concurrency:
  group: cloud-runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: build and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cloud-runner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: papaya-agent-runtime:candidate
          provenance: false
          sbom: false
      - name: Smoke test
        run: docker/cloud-runner/smoke.sh papaya-agent-runtime:candidate
