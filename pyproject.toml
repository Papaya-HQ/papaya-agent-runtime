[project]
name = "papaya-agent-runtime"
# The version is a git tag, not a line in this file. Every merge to `main` is
# tagged `v<major>.<minor>.<patch>` by `.github/workflows/release.yml`, and
# `src/papaya_agent_runtime/version.py` reads that tag back out of the checkout —
# which is the only honest source, since this runtime is always run from a
# checkout and never built into a wheel. A literal here would have to be bumped
# by hand and would name the same build on every machine when nobody did; it said
# `0.0.0` for the whole of the project's life, and the desktop machine card
# printed that.
#
# `dynamic` is accepted without a build backend because `[tool.uv] package =
# false` below makes this a virtual project: uv never builds it, records no
# version for the root in `uv.lock`, and `uv sync --frozen` — what CI runs —
# resolves it exactly as before.
dynamic = ["version"]
description = "A lightweight, local framework for directing autonomous software work across one or more Git repositories."
readme = "README.md"
requires-python = ">=3.13"
# One runtime dependency, and it is deliberate. The control plane is otherwise
# standard library only; Treehouse, gh-axi and lavish-axi are pinned companion
# CLIs, not Python libraries.
#
# `papaya-agent-client` is embedded rather than shelled out to: `ppy serve` runs
# the client's listener loop in-process, so its cursor, reservations, renewals and
# supervised-protocol writer are used as-is instead of reimplemented here. That
# makes this a library API dependency, not a tool: pre-1.0 the minor is the
# client's breaking-change unit, so the range is the current 0.18 line and moving
# to 0.19 is a deliberate change with the import sites re-checked. 0.18.0 is the
# floor because `ppy serve` advertises `instruction_intents` through the embed
# builders' `extra_capabilities`, which arrived in it; without it Papaya never
# routes a question to this machine.
dependencies = [
    "papaya-agent-client>=0.18.0,<0.19.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.uv]
# This repository is an agent-home/control-plane, not a distributable wheel.
# Treat it as a virtual project so `uv run` provisions dev tools without a build.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: spawns real Claude/Codex CLIs; opt-in and excluded from the default run",
    "strict_forge: exercises the real forge-URL rule in `ppy repo add` instead of the fixture default that makes a temp source repo its own forge",
    "real_provider_default: exercises the real unnamed-provider rule (the configured worker provider) instead of the fixture default that makes a hermetic dispatch fake",
]
# Default run stays hermetic (no live network, no provider spawning).
addopts = "-m 'not live'"
