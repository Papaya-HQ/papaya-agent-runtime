[project]
name = "papaya-agent-runtime"
version = "0.0.0"
description = "A lightweight, local framework for directing autonomous software work across one or more Git repositories."
readme = "README.md"
requires-python = ">=3.13"
# One runtime dependency, and it is deliberate. The control plane is otherwise
# standard library only; Treehouse, gh-axi and lavish-axi are pinned companion
# CLIs, not Python libraries.
#
# `papaya-agent-client` is embedded rather than shelled out to: `ppy serve` runs
# the client's listener loop in-process, so its cursor, reservations, renewals and
# supervised-protocol writer are used as-is instead of reimplemented here. That
# makes this a library API dependency, not a tool: pre-1.0 the minor is the
# client's breaking-change unit, so the range is the current 0.15 line and moving
# to 0.16 is a deliberate change with the import sites re-checked. 0.15 is the
# release that carries the `runner=` seam `ppy serve` builds on.
dependencies = [
    "papaya-agent-client>=0.15.0,<0.16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.uv]
# This repository is an agent-home/control-plane, not a distributable wheel.
# Treat it as a virtual project so `uv run` provisions dev tools without a build.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: spawns real Claude/Codex CLIs; opt-in and excluded from the default run",
    "strict_forge: exercises the real forge-URL rule in `ppy repo add` instead of the fixture default that makes a temp source repo its own forge",
    "real_provider_default: exercises the real unnamed-provider rule (the configured worker provider) instead of the fixture default that makes a hermetic dispatch fake",
]
# Default run stays hermetic (no live network, no provider spawning).
addopts = "-m 'not live'"
